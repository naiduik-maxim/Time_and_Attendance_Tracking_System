{% extends "base.html" %}

{% block title %}Відновлення пароля{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="form-card auth-card">
        <h1>Відновлення пароля</h1>
        <p class="page-subtitle">Вкажіть email облікового запису, і ми надішлемо посилання.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn">Надіслати посилання</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
