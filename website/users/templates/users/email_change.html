
{% extends "base.html" %}

{% block title %}Зміна email{% endblock %}

{% block content %}
<div class="form-layout">
    <div class="form-card">
        <h1>Зміна email</h1>

        <p>Поточна адреса: {{ request.user.email }}</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button class="btn" type="submit">Надіслати підтвердження</button>
            </div>
        </form>

        <p class="form-footnote"><a href="{% url 'password_reset' %}">Змінити пароль через email</a></p>
    </div>
</div>
{% endblock %}
