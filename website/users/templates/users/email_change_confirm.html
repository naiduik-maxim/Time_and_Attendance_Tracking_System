
{% extends "base.html" %}

{% block title %}Підтвердження email{% endblock %}

{% block content %}
<div class="status-card">
<h1>Підтвердження зміни email</h1>

{% if valid %}
    <form method="post">
        {% csrf_token %}
        <button class="btn" type="submit">
            Підтвердити нову адресу
        </button>
    </form>
{% else %}
    <p>Це посилання недійсне або вже використане.</p>

    <a href="{% url 'email_change' %}">
        Запросити нове посилання
    </a>
{% endif %}
</div>
{% endblock %}
