{% extends "base.html" %}

{% block content %}
    <dialog
        class="profile-dialog"
        data-auto-dialog
        aria-labelledby="password-title"
    >
        <h2 id="password-title">Новий пароль</h2>

        {% if validlink %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn" type="submit">
                    Зберегти пароль
                </button>
            </form>
        {% else %}
            <p>
                Посилання недійсне, прострочене
                або вже використане.
            </p>
        {% endif %}

        <a href="{% url 'login' %}">
            Повернутися до входу
        </a>
    </dialog>
{% endblock %}
