{% extends 'base.html' %}

{% block title %}Вибір підрозділу{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>Оберіть підрозділ для роботи</h2>
</div>

<table>
    <thead>
        <tr>
            <th>Код</th>
            <th>Назва підрозділу</th>
            <th style="width: 200px; text-align: center;">Дії</th>
        </tr>
    </thead>
    <tbody>
        {% for unit in units %}
            <tr>
                <td>{{ unit.code }}</td>
                <td>{{ unit.title }}</td>
                <td style="text-align: center;">
                    <a href="{% url 'tabel_list' unit.id %}" class="btn">Перейти до табелів</a>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3" style="text-align: center;">Підрозділи ще не створені.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
